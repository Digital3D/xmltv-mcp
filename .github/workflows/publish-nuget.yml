# Publishes the XmltvDigital3d.Mcp package to nuget.org with Trusted Publishing: no API key is stored, nuget.org
# trusts this workflow of this repository (policy of the owner "digital3d" on nuget.org) and hands it a key
# that lives one hour. The .nupkg is not built here: it is the asset attached to the GitHub release named by
# "tag", built by the Azure pipeline of the sources.
name: Publish to nuget.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose .nupkg asset is published (for example v1.0.9)'
        required: true
        type: string

permissions:
  id-token: write   # the OIDC token nuget.org checks against the policy
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the .nupkg of the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as variables, never written into the script: a tag is typed by hand.
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Only this package, at the version of the tag: a push to nuget.org cannot be undone.
          expected="XmltvDigital3d.Mcp.${TAG#v}.nupkg"
          gh release download "$TAG" --repo "$REPO" --pattern "$expected" --dir package
          if [ ! -f "package/$expected" ]; then echo "The release $TAG has no asset named $expected"; exit 1; fi
          ls -l package
          echo "NUPKG=package/$expected" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: NuGet login (Trusted Publishing)
        id: login
        # Pinned to a commit: this action receives the OIDC token and the key.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: digital3d   # nuget.org profile name, not an e-mail address

      - name: Push
        run: dotnet nuget push "$NUPKG" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
